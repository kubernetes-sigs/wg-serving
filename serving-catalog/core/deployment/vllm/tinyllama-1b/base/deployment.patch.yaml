apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tinyllama-1b-vllm-inference-server
  name: tinyllama-1b-vllm-deployment
spec:
  selector:
    matchLabels:
      app: tinyllama-1b-vllm-inference-server
      deployment: tinyllama-1b-vllm-deployment
  template:
    metadata:
      labels:
        app: tinyllama-1b-vllm-inference-server
        deployment: tinyllama-1b-vllm-deployment
    spec:
      containers:
      - name: inference-server
        env:
          - name: MODEL_ID
            value: TinyLlama/TinyLlama-1.1B-Chat-v1.0
