apiVersion: apps/v1
kind: Deployment
metadata:
  name: '*'
spec:
  # First Neuron compile often exceeds 10m; default 600s yields ProgressDeadlineExceeded.
  progressDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        ai.aws.com/model: llama3-8b
        ai.aws.com/inference-server: vllm
        examples.ai.aws.com/source: blueprints
    spec:
      # Pin host DRAM for Neuron compile: inf2.xlarge (~16 GiB) is too small; use 8xlarge.
      nodeSelector:
        node.kubernetes.io/instance-type: inf2.8xlarge
      # Mountpoint S3 mounts /data/models read-only; Neuron compile cache must live outside that tree.
      containers:
        - name: inference-server
          env:
            # Override 1-Inf2 default (TP=2): single-core compile/serve to cut RAM / HLO size.
            - name: TENSOR_PARALLEL_SIZE
              value: "1"
            - name: NEURON_COMPILED_ARTIFACTS
              value: /var/cache/neuron-compiled-artifacts
          resources:
            # inf2.8xlarge ~128 GiB host RAM; compile can exceed 100Gi (OOM seen at 100Gi limit).
            requests:
              memory: "104Gi"
            limits:
              memory: "120Gi"
          volumeMounts:
            - name: neuron-compiled-artifacts
              mountPath: /var/cache/neuron-compiled-artifacts
      volumes:
        - name: neuron-compiled-artifacts
          emptyDir: {}
        # Cap /dev/shm tmpfs; it counts against the same memory limit as the process.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
