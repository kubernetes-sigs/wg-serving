# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: inf2.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  # Same convention as 1-Inf2: vLLM-Neuron tp_size = NeuronCore count (2 per chip).
  # 12 chips × 2 NeuronCores = 24.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENSOR_PARALLEL_SIZE
          value: "24"
    target:
      kind: Deployment
