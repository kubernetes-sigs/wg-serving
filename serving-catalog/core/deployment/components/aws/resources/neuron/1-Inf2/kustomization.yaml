# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: inf2.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENSOR_PARALLEL_SIZE
          # 1 Inferentia2 chip = 2 NeuronCores; vLLM-Neuron uses tp_size = #cores.
          value: "2"
    target:
      kind: Deployment
