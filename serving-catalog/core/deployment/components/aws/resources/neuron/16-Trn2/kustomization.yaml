# kustomization.yaml
# trn2.48xlarge: 16 Trainium2 accelerators (AWS EC2 Trn2 table). TP follows chip count here;
# Inf2 components use NeuronCore-based TP — see 1-Inf2 / 12-Inf2 comments.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: trn2.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENSOR_PARALLEL_SIZE
          value: "16"
    target:
      kind: Deployment
